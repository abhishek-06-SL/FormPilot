<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 250px; padding: 14px; font-family: sans-serif; }
    h3 { font-size: 14px; margin: 0 0 10px 0; color: #1e293b; }
    select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <h3>FormPilot Settings</h3>
  <label style="font-size:12px; color:#64748b;">Language Preference</label>
  <select id="lang">
    <option value="en">English</option>
    <option value="hi" selected>Hindi (हिंदी)</option>
    <option value="ta">Tamil (தமிழ்)</option>
    <option value="te">Telugu (తెలుగు)</option>
    <option value="mr">Marathi (मराठी)</option>
  </select>
</body>
</html>
